name: oracle-canary

# Corrida canario de costo/calidad del "Oracle" (minería de quejas + consejo).
# NO es producción, no escribe nada al repo ni a Supabase — solo imprime
# costos reales por etapa. Solo fuentes públicas (los logs de Actions son
# públicos en este repo).
on:
  workflow_dispatch: {}

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Canario
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m scripts.oracle_canary
