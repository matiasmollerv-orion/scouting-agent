name: queue-market-analysis

# Encola un mercado/oportunidad para análisis desde una sesión de Claude
# Code (el usuario se lo da a Claude en el chat) — solo escribe la fila,
# NO corre el análisis caro. Ese paso es siempre separado (market-analysis.yml).
on:
  workflow_dispatch:
    inputs:
      market_name:
        description: "Nombre del mercado/oportunidad (NO una empresa — ej: 'asesoría de inversión IA para clase media chilena')"
        required: true
      empresas_referentes:
        description: "Empresas de referencia, separadas por coma (opcional — ej: 'Decade (Brasil), Farther (EEUU)')"
        required: false
      beachhead_hint:
        description: "Hipótesis de beachhead ya discutida (opcional)"
        required: false
      context_note:
        description: "Contexto adicional (opcional)"
        required: false

jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Encolar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MARKET_NAME: ${{ inputs.market_name }}
          EMPRESAS_REFERENTES: ${{ inputs.empresas_referentes }}
          BEACHHEAD_HINT: ${{ inputs.beachhead_hint }}
          CONTEXT_NOTE: ${{ inputs.context_note }}
        run: python -m scripts.queue_market_analysis
