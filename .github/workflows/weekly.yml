name: weekly-scouting

on:
  schedule:
    # Sábado 12:07 UTC (~08:00/09:00 Chile según horario). El minuto :00 en
    # punto es el más congestionado de GitHub Actions a nivel global (ahí
    # caen todos los crons del mundo) — 2026-07-18 se atrasó 46+ min por eso.
    # Corriendo en :07 se evita ese pico; igual puede atrasarse algo bajo carga.
    - cron: "7 12 * * 6"
  workflow_dispatch: {}  # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write  # necesario para commitear el reporte de vuelta

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Guardia de idempotencia — 2026-09-05: el cron se atrasó 3h (12:07
      # -> 15:06 UTC) y mientras tanto se disparó a mano por impaciencia.
      # Las 2 corridas completas del pipeline pagado corrieron esa semana,
      # cada una con su propio muestreo real de candidatos (seen_urls.json
      # se actualiza recién al final de cada corrida exitosa, así que la
      # 2da corrida no vio los "vistos" de la 1ra hasta que ya había
      # arrancado) — 2 emails distintos, ~2x costo, y el reporte .md de la
      # 1ra corrida quedó pisado en git por el commit de la 2da. Si el
      # reporte de esta semana YA existe en el repo (otra corrida — cron o
      # manual — ya lo completó y pusheó), no vale la pena correr el
      # pipeline pagado de nuevo.
      - name: Verificar si esta semana ya se procesó
        id: check
        run: |
          WEEK_KEY=$(date -u +%Y-W%V)
          if [ -f "reports/${WEEK_KEY}.md" ]; then
            echo "reports/${WEEK_KEY}.md ya existe — otra corrida ya procesó esta semana. Abortando para no duplicar costo ni email."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        if: steps.check.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Run scouting agent
        if: steps.check.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -m src.main

      - name: Commit report
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "scouting-bot"
          git config user.email "actions@github.com"
          git add reports/ data/
          if git diff --staged --quiet; then
            echo "Sin cambios en reports/"
          else
            git commit -m "report: scouting semanal $(date -u +%Y-W%V)"
            git pull --rebase origin main
            git push
          fi
