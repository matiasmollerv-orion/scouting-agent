name: list-market-queue

# Solo lectura — lista id/status/market_name de todas las filas de
# scouting_market_analysis, para poder apuntar update-market-queue.yml a un
# id concreto sin abrir el dashboard.
on:
  workflow_dispatch: {}

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Listar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m scripts.list_market_queue
