name: ecommerce-backlog

# Consulta ad-hoc manual — NO tiene schedule, corre solo si alguien la
# dispara a mano desde Actions o `gh workflow run`. Usa la misma API key
# que el resto del pipeline (secret del repo, nunca pasa por texto plano).
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backlog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run ecommerce backlog query
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m scripts.ecommerce_backlog
